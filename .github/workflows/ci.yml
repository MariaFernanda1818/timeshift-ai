name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Unit tests only: they use labelled test doubles and need neither the Decider model
      # nor AWS. Live tests (-m live) run locally against a real Decider server.
      - run: pip install -e ".[dev]" -e "reusable-patterns/counterfactual-decision-gate[strands]"
      - run: ruff check bench src reusable-patterns tests scripts
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build
