[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timeshift"
version = "0.1.0"
description = "TIME//SHIFT: a counterfactual mission-control agent gated by Strands Decider 2B."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.61",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "boto3>=1.35",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.15", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "reusable-patterns/counterfactual-decision-gate/tests"]
markers = ["live: requires a running Strands Decider server and/or AWS credentials"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
